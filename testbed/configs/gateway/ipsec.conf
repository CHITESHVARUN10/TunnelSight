config setup
    charondebug="ike 1, knl 1, cfg 0"
    uniqueids=no

conn %default
    ikelifetime=60m
    keylife=20m
    rekeymargin=3m
    keyingtries=1
    keyexchange=ikev2
    authby=secret

conn tunnel-modern
    left=10.0.0.10
    leftid=10.0.0.10
    right=10.0.0.20
    rightid=10.0.0.20
    # Strong Encryption: AES-256-GCM, DH Group 19 (ecp256)
    ike=aes256gcm16-prfsha256-ecp256!
    esp=aes256gcm16-ecp256!
    auto=add
